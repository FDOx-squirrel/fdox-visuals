<rect x="1330" y="255" width="370" height="200" rx="14" fill="white" stroke="#004473" stroke-width="3.5"/><text x="1352" y="301" text-anchor="start" font-family="Fira Sans" font-weight="700" font-size="24" fill="#161B2E">What this shows</text><text x="1352" y="335.12" text-anchor="start" font-family="Fira Sans" font-weight="400" font-size="19" fill="#5B6478">3D models and software share</text><text x="1352" y="361.34000000000003" text-anchor="start" font-family="Fira Sans" font-weight="400" font-size="19" fill="#5B6478">concepts, so a query from one</text><text x="1352" y="387.56000000000006" text-anchor="start" font-family="Fira Sans" font-weight="400" font-size="19" fill="#5B6478">finds the other: the extractor,</text><text x="1352" y="413.7800000000001" text-anchor="start" font-family="Fira Sans" font-weight="400" font-size="19" fill="#5B6478">the analysis and two stones.</text>
<rect x="1330" y="490" width="370" height="240" rx="14" fill="white" stroke="#004473" stroke-width="3.5" stroke-dasharray="14 9"/><text x="1352" y="536" text-anchor="start" font-family="Fira Sans" font-weight="700" font-size="24" fill="#004473">What it does not</text><text x="1352" y="570.12" text-anchor="start" font-family="Fira Sans" font-weight="400" font-size="19" fill="#5B6478">CHUIS/1 says “Ogham Stone” as text</text><text x="1352" y="596.34" text-anchor="start" font-family="Fira Sans" font-weight="400" font-size="19" fill="#5B6478">only and is missing from Q2016147.</text><text x="1352" y="622.5600000000001" text-anchor="start" font-family="Fira Sans" font-weight="400" font-size="19" fill="#5B6478">The Beuys stele and the Freshford</text><text x="1352" y="648.7800000000001" text-anchor="start" font-family="Fira Sans" font-weight="400" font-size="19" fill="#5B6478">well share no concept with another</text><text x="1352" y="675.0000000000001" text-anchor="start" font-family="Fira Sans" font-weight="400" font-size="19" fill="#5B6478">FDO. The query makes that visible.</text>
<text x="60" y="790" text-anchor="start" font-family="Fira Sans" font-weight="400" font-size="21" fill="#161B2E">Also shared: both software FDOs carry OSM relation 62273 as dct:spatial.</text>
